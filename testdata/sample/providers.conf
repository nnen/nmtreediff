# A sample provider configuration. Pass it with --config.
#
# A key beginning with a dot is a file extension, matched without regard to
# case. The only other key is "fallback".

# Our exporter writes behaviour trees with this suffix.
.bt        = bt
.btree     = bt

# And our level data is JSON under a name of its own.
.leveldata = json

# What to use for a file nothing else claims.
fallback   = xml
